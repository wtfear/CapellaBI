<svg width="240" height="42" viewBox="0 0 240 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capellaGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldCoreCapella" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="capellaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Capella Golden Quadruple Star Emblem -->
  <g transform="translate(3, 3)">
    <!-- Outer Radiant Star Burst -->
    <path d="M18 0L23.5 12.5L36 18L23.5 23.5L18 36L12.5 23.5L0 18L12.5 12.5Z" fill="url(#capellaGrad)" />
    <!-- Inner Core Golden Star -->
    <path d="M18 5L21.5 14.5L31 18L21.5 21.5L18 31L14.5 21.5L5 18L14.5 14.5Z" fill="url(#goldCoreCapella)" filter="url(#capellaGlow)" opacity="0.95" />
    <!-- Center Golden Core -->
    <circle cx="18" cy="18" r="4" fill="#FFFFFF" />
    <circle cx="18" cy="18" r="2" fill="#D97706" />
  </g>

  <!-- Typography -->
  <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.5" fill="#0F172A">CAPELLA</text>
  <rect x="150" y="11" width="42" height="20" rx="4" fill="#F59E0B" />
  <text x="159" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">BI</text>
</svg>
